  <script>
    // App installabile: il guscio (questi file) resta sul dispositivo e si aggiorna da solo
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      const ricarica = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (ricarica && S.vista !== 'form') location.reload(); });
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
